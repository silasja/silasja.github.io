<body>
  <header class="site-header">
    <a class="branding" href="index.html" aria-label="Go to homepage">

    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">Menu</button>
    <nav class="site-nav" aria-label="Primary navigation">

      <a href="projects.html">Projects</a>
      <a href="photography.html" aria-current="page">Photography</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page-main page-main--gallery">
    <section class="gallery-head reveal">
      <p class="section-title"><a href="photography.html">Photography</a></p>
      <h1>Cityscapes</h1>
      <p>People, buildings and infrastructure merging into the urban environment.</p>
    </section>

    <section class="gallery-track" aria-label="Cityscapes gallery">
      <figure class="gallery-item" style="--ratio: 0.75"><img src="images/cityscapes/city1.jpeg" width="768" height="1024" alt="Cityscape photograph 1" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 0.7442"><img src="images/cityscapes/city2.jpeg" width="765" height="1028" alt="Cityscape photograph 2" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 1.3333"><img src="images/cityscapes/city3.jpeg" width="1024" height="768" alt="Cityscape photograph 3" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 1.3333"><img src="images/cityscapes/city4.jpeg" width="1024" height="768" alt="Cityscape photograph 4" loading="lazy" decoding="async" /></figure>

      <figure class="gallery-item" style="--ratio: 0.75"><img src="images/cityscapes/thumbs/la_crossing.jpg" data-full="images/cityscapes/la_crossing.jpeg" width="3456" height="4608" alt="Los Angeles crossing cityscape" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 0.75"><img src="images/cityscapes/thumbs/ny_gotham.jpg" data-full="images/cityscapes/ny_gotham.jpeg" width="3456" height="4608" alt="New York Gotham cityscape" loading="lazy" decoding="async" /></figure>
      
      <figure class="gallery-item" style="--ratio: 0.7542"><img src="images/cityscapes/thumbs/ny_morning.jpg" data-full="images/cityscapes/ny_morning.jpeg" width="3366" height="4463" alt="New York morning cityscape" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 0.7557"><img src="images/cityscapes/thumbs/la_skatepark.jpg" data-full="images/cityscapes/la_skatepark.jpeg" width="3369" height="4458" alt="Los Angeles skatepark cityscape" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 1.3466"><img src="images/cityscapes/thumbs/shibuya1.jpg" data-full="images/cityscapes/shibuya1.jpeg" width="4608" height="3422" alt="Shibuya cityscape 1" loading="lazy" decoding="async" /></figure>
      <figure class="gallery-item" style="--ratio: 1.5557"><img src="images/cityscapes/thumbs/shibuya2.jpg" data-full="images/cityscapes/shibuya2.jpeg" width="4608" height="2962" alt="Shibuya cityscape 2" loading="lazy" decoding="async" /></figure>
