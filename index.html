<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal Photography Portfolio</title>
  <meta name="description" content="Minimal photography portfolio — gallery with categories" />
  <style>
    /* Minimal, elegant styles */
    :root{--gap:18px;--maxw:1200px}
    html,body{height:100%;margin:0;font-family:Inter, Roboto, system-ui, -apple-system, "Segoe UI", Arial; background:#fff;color:#111}
    .wrap{max-width:var(--maxw);margin:36px auto;padding:0 20px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{font-weight:700;letter-spacing:0.02em}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .nav button{background:transparent;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
    .nav button.active{background:#f3f3f3}

    /* Gallery grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gap)}
    .card{position:relative;overflow:hidden;border-radius:10px;background:#fafafa}
    .card img{display:block;width:100%;height:100%;object-fit:cover;vertical-align:middle}
    .meta{position:absolute;left:12px;bottom:12px;padding:6px 10px;background:rgba(255,255,255,0.86);border-radius:8px;font-size:13px}

    /* Lightbox */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);z-index:1200}
    .lightbox.open{display:flex}
    .lightbox img{max-width:95%;max-height:85%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
    .lb-close{position:absolute;top:18px;right:18px;background:transparent;border:0;color:#fff;font-size:20px;padding:8px;cursor:pointer}
    .lb-caption{position:absolute;left:20px;bottom:20px;color:#fff;font-size:14px}

    /* small screens */
    @media (max-width:520px){:root{--gap:12px}.brand{font-size:16px}.nav button{padding:6px 8px;font-size:14px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Your Name — Photography</div>
      <nav class="nav" aria-label="Categories">
        <button data-filter="all" class="active">All</button>
        <button data-filter="landscape">Landscape</button>
        <button data-filter="portrait">Portrait</button>
        <button data-filter="street">Street</button>
        <button data-filter="architecture">Architecture</button>
      </nav>
    </header>

    <main>
      <section class="grid" id="gallery">
        <!-- Example items. Replace src with your own images in /images/ or external links -->
        <figure class="card" data-category="landscape">
          <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=80&auto=format&fit=crop" alt="Mountain landscape">
          <figcaption class="meta">Mountain — Landscape</figcaption>
        </figure>

        <figure class="card" data-category="portrait">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=1200&q=80&auto=format&fit=crop" alt="Portrait of a woman">
          <figcaption class="meta">Portrait — Model</figcaption>
        </figure>

        <figure class="card" data-category="street">
          <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b?w=1200&q=80&auto=format&fit=crop" alt="Street scene">
          <figcaption class="meta">City Street — Street</figcaption>
        </figure>

        <figure class="card" data-category="architecture">
          <img src="https://images.unsplash.com/photo-1432821596592-e2c18b78144f?w=1200&q=80&auto=format&fit=crop" alt="Modern building">
          <figcaption class="meta">Modern Building — Architecture</figcaption>
        </figure>

        <!-- Duplicate a few to show layout (you'll replace with your portfolio) -->
        <figure class="card" data-category="landscape">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80&auto=format&fit=crop" alt="Forest path">
          <figcaption class="meta">Forest — Landscape</figcaption>
        </figure>

        <figure class="card" data-category="portrait">
          <img src="https://images.unsplash.com/photo-1519345182560-3f2917c472ef?w=1200&q=80&auto=format&fit=crop" alt="Portrait, soft light">
          <figcaption class="meta">Soft Light — Portrait</figcaption>
        </figure>

      </section>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <img id="lbImage" src="" alt="" />
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <script>
    // Filtering
    const buttons = document.querySelectorAll('.nav button');
    const cards = document.querySelectorAll('.grid .card');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.nav button.active').classList.remove('active');
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        cards.forEach(c => {
          if(filter === 'all' || c.dataset.category === filter){
            c.style.display = '';
          } else {
            c.style.display = 'none';
          }
        });
      });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbCaption = document.getElementById('lbCaption');
    const lbClose = document.getElementById('lbClose');

    document.querySelectorAll('.grid .card img').forEach(img => {
      img.addEventListener('click', (e) => {
        lbImage.src = e.currentTarget.src.replace(/w=1200[^&]*/,'w=2400'); // try show bigger when using unsplash
        lbImage.alt = e.currentTarget.alt || '';
        lbCaption.textContent = e.currentTarget.parentElement.querySelector('.meta')?.textContent || '';
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
      });
    });

    lbClose.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden','true');
      lbImage.src = '';
    });

    // close on ESC
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && lightbox.classList.contains('open')){
        lbClose.click();
      }
    });
  </script>

  <!--
    Instructions:
    - Replace the sample images with your own in the images/ folder or change the src attributes to point to your hosted images.
    - Save this file as index.html and push to a GitHub repository named: <your-github-username>.github.io
    - When you push to the main branch of that repo, GitHub Pages will publish your site at: https://<your-github-username>.github.io

    Optional improvements to add later:
    - Add lazy-loading (loading="lazy") for images
    - Add small CSS transitions and hover effects
    - Add a simple contact page or About section
    - Use a build step (eleventy, vite) or frameworks if you want collections, markdown galleries, or metadata-based pages
  -->
</body>
</html>
