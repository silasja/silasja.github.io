<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Seascapes - Silas Janke Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.4/dist/photoswipe.css" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="site-header">
    <a class="branding" href="index.html" aria-label="Go to homepage">
      <span class="name">Silas Janke</span>
      <span class="role">Coding for Space and Earth</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">Menu</button>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="photography.html" aria-current="page">Photography</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page-main page-main--gallery">
    <section class="gallery-head reveal">
      <p class="section-title"><a href="photography.html">Photography</a></p>
      <h1>Seascapes</h1>
      <p>Coastal landscapes, glacier-carved fjords and beaches. </p>
    </section>

    <figure class="gallery-item panorama" style="--ratio: 1.7833">
      <img src="images/seascapes/thumbs/pano1.jpg" data-full="images/seascapes/pano1.jpeg" width="5175" height="2902" alt="Seascapes panoramic photograph" loading="lazy" decoding="async" />
    </figure>

    <section class="gallery-track" aria-label="Seascapes gallery">

      <figure class="gallery-item" style="--ratio: 1.3486">
        <img src="images/seascapes/sea3.jpeg" width="1029" height="763" alt="Seascape photograph 3" loading="lazy" decoding="async" />
      </figure>

      <figure class="gallery-item" style="--ratio: 1.3469">
        <img src="images/seascapes/sea2.jpeg" width="1029" height="764" alt="Seascape photograph 2" loading="lazy" decoding="async" />
      </figure>

      <figure class="gallery-item" style="--ratio: 1.3333">
        <img src="images/seascapes/sea4.jpeg" width="1024" height="768" alt="Seascape photograph 4" loading="lazy" decoding="async" />
      </figure>   
      
      <figure class="gallery-item" style="--ratio: 1.3333">
        <img src="images/seascapes/sea1.jpeg" width="1024" height="768" alt="Seascape photograph 1" loading="lazy" decoding="async" />
      </figure>
       
    </section>
  </main>

  <footer class="page-footer">
    <span>Silas Janke</span>
    <span>Seascapes Gallery</span>
    <span>&copy; <span data-year></span></span>
