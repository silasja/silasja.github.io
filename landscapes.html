<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landscapes — Silas Janke Photography</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
  <!-- PhotoSwipe CSS (v4) -->
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@4.1.3/dist/photoswipe.css">
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@4.1.3/dist/default-skin/default-skin.css">
  
  <style>

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'PT Mono', monospace;
      font-weight: 400;
      font-style: normal;
      background: #fff;
      color: #fff;
      scroll-behavior: smooth;
    }

    /* Fixed header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: flex-start;  /* brand stays left */
      align-items: center;
      padding: 2rem 2rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      color: #111;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    /* Brand — left-aligned */
    header .brand {
      font-size: 1.4rem;
      cursor: pointer; 
    }

    header .brand:hover {
      transform: scale(1.02);
      cursor: pointer;
    }


    /* Subtitle — centered across entire screen */
    header .subtitle {
      position: absolute;       /* removes from the flex flow */
      left: 50%;                /* center horizontally */
      transform: translateX(-50%);
      font-size: 3rem;
      opacity: 0.7;
      cursor: pointer;
    }

    /* Masonry-style grid */
    main {
      max-width: 1600px;
      margin: 6rem auto;
      column-count: 3;
      column-gap: 6px;
      padding: 0 1rem;
    }

    .photo {
      break-inside: avoid;
      margin-bottom: 6px;
      padding: 0.4rem 0.4rem;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* Lightbox styles */
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 1200;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
      /* Make inner centered and constrained to viewport; images scale to fit height instead of scrolling */
      .lightbox .inner { max-width: 96%; max-height: 100vh; position: relative; display:flex; align-items:center; justify-content:center; }
      /* Force image to scale to viewport height (minus padding) while preserving aspect ratio */
      .lightbox img { max-width: 100%; height: calc(100vh - 40px); width: auto; object-fit: contain; display: block; border-radius: 2px; }
    .lightbox .close {
      position: absolute; top: -10px; right: -10px; background: rgba(0,0,0,0.6); color: #fff; border: 0; padding: 8px 10px; cursor: pointer; font-size: 18px; border-radius: 4px;
    }

    .photo img:hover {
      transform: scale(1.02);
      filter: brightness(105%);
      cursor: pointer;
    }

    /* Panorama block that spans all columns in the masonry layout */
    .panorama {
      break-inside: avoid;
      -webkit-column-span: all;
      column-span: all;
      margin: 0 0 6px;
      overflow: hidden;
    }

    .panorama img {
      width: 100%;
      height: auto;
      display: block;
    }

    .panorama img:hover {
      transform: scale(1.02);
      filter: brightness(105%);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      main { column-count: 2; }
    }

    @media (max-width: 600px) {
      main { column-count: 1; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand" onclick="window.location.href='index.html'">
      Silas Janke - Photography 
    </div>
    <div class="subtitle" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      Landscapes
    </div>
  </header>

  <main>
    <div class="photo"><img src="images/landscapes/land1.jpeg" alt="Landscape 1" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land3.jpeg" alt="Landscape 3" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land4.jpeg" alt="Landscape 4" loading="lazy"></div>

    <!-- Panorama that spans the full width of the column container -->
    <div class="panorama">
      <img src="images/landscapes/pano1.jpeg" alt="Panoramic landscape" loading="lazy">
    </div>

    <div class="photo"><img src="images/landscapes/land5.jpeg" alt="Landscape 5" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land6.jpeg" alt="Landscape 6" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land7.jpeg" alt="Landscape 7" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land9.jpeg" alt="Landscape 9" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land10.jpeg" alt="Landscape 10" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land12.jpeg" alt="Landscape 12" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land13.jpeg" alt="Landscape 13" loading="lazy"></div>
    <div class="photo"><img src="images/landscapes/land14.jpeg" alt="Landscape 14" loading="lazy"></div>
  </main>

  <!-- Root element required by PhotoSwipe -->
  <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="pswp__bg"></div>
    <div class="pswp__scroll-wrap">
      <div class="pswp__container">
        <div class="pswp__item"></div>
        <div class="pswp__item"></div>
        <div class="pswp__item"></div>
      </div>
      <div class="pswp__ui pswp__ui--hidden">
        <div class="pswp__top-bar">
          <div class="pswp__counter"></div>
          <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
          <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
          <div class="pswp__preloader">
            <div class="pswp__preloader__icn">
              <div class="pswp__preloader__cut">
                <div class="pswp__preloader__donut"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
          <div class="pswp__share-tooltip"></div>
        </div>
        <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
        <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>
        <div class="pswp__caption">
          <div class="pswp__caption__center"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PhotoSwipe JS (v4) -->
  <script src="https://unpkg.com/photoswipe@4.1.3/dist/photoswipe.min.js"></script>
  <script src="https://unpkg.com/photoswipe@4.1.3/dist/photoswipe-ui-default.min.js"></script>

  <script>
  (function(){
    // Build items array from thumbnails
    const thumbs = Array.from(document.querySelectorAll('main .photo img, main .panorama img'));
    const items = thumbs.map(img => ({
      src: img.dataset.full || img.src,
      w: img.naturalWidth || parseInt(img.dataset.pswpWidth,10) || 0,
      h: img.naturalHeight || parseInt(img.dataset.pswpHeight,10) || 0,
      title: ''
    }));

    function ensureSize(index, cb){
      const item = items[index];
      if (item.w && item.h) return cb();
      const img = new Image();
      img.onload = function(){ item.w = img.naturalWidth; item.h = img.naturalHeight; cb(); };
      img.onerror = cb;
      img.src = item.src;
    }

    function openPhotoSwipe(index){
      ensureSize(index, function(){
        const pswpElement = document.querySelectorAll('.pswp')[0];
        const options = { index: index, bgOpacity: 0.85, showHideOpacity: true };
        const gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, options);
        gallery.init();
      });
    }

    thumbs.forEach((thumb,i) => {
      thumb.style.cursor = 'pointer';
      thumb.addEventListener('click', (e)=>{ e.preventDefault(); openPhotoSwipe(i); });
    });
  })();
  </script>
</body>
</html>
